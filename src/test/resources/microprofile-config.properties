x1.stomp.control.QuickQuoteService/mp-rest/url=https://quote.cnbc.com/quote-html-webservice
x1.stomp.control.QuoteUpdater/enable=false

mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:9092

smallrye.messaging.metrics.mp.enabled=false
smallrye.messaging.micrometer.mp.enabled=true

mp.messaging.outgoing.to-kafka.connector=smallrye-kafka
mp.messaging.outgoing.to-kafka.topic=stocks
mp.messaging.outgoing.to-kafka.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.to-kafka.key.serializer=org.apache.kafka.common.serialization.IntegerSerializer
mp.messaging.outgoing.to-kafka.cloud-events=false

mp.messaging.incoming.from-kafka.connector=smallrye-kafka
mp.messaging.incoming.from-kafka.topic=stocks
mp.messaging.incoming.from-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.from-kafka.key.deserializer=org.apache.kafka.common.serialization.IntegerDeserializer
mp.messaging.incoming.from-kafka.max.poll.records=10
#mp.messaging.incoming.from-kafka.poll-timeout=2000
#mp.messaging.incoming.from-kafka.max.poll.interval.ms=300000
#mp.messaging.incoming.from-kafka.auto.commit.interval.ms=5000
mp.messaging.connector.smallrye-kafka.group.id="stomp-test"
# Needed since the consumer joins after the messages are sent
mp.messaging.incoming.from-kafka.auto.offset.reset=latest
mp.messaging.incoming.from-kafka.cloud-events=false
