services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.28
    container_name: etcd
    command: ["etcd", "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://etcd:2379"]
    environment:
     - ETCD_ENABLE_V2=true
  db:
    image: registry.x1/j7beck/x1-postgres-stomp-test:1.10
    container_name: stomp-test-db
    volumes:
     - /opt/docker/x1/certs/stomp-test-db.key:/etc/pki/tls/private/node.key:ro
     - /opt/docker/x1/certs/stomp-test-db.crt:/etc/pki/tls/certs/node.crt:ro
  wildfly:
    image: registry.x1/j7beck/x1-wildfly-jar-stomp-test:1.10
    environment:
     - X1_SERVICE_REGISTRY_ETCD=http://etcd:2379
     - X1_SERVICE_REGISTRY_STAGE=docker
     - OTEL_COLLECTOR=otel-collector
     - OTEL_SERVICE_NAME=stmp-test
     - DB_SERVER=db
     - DB_PORT=5432
     - DB_NAME=stocks
     - GC_MAX_METASPACE_SIZE=256
     - GC_METASPACE_SIZE=96
     - SERVICE_NAME=stomp-test
     - CLIENT_SECRET=ZMrCN8SupKG3Fo69BGrMLT5zshNGFM5K
    volumes:
     - /opt/docker/x1/certs/docker.key:/etc/pki/tls/private/node.key:ro
     - /opt/docker/x1/certs/docker.crt:/etc/pki/tls/certs/node.crt:ro
     - /etc/ssl/certs/java/cacerts:/etc/pki/java/cacerts:ro
    ports:
     - "8080:8080"
     - "8443:8443"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /etc/ssl/certs/cacert.pem:/etc/cacert.crt
    ports:
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
  kafka:
    image: apache/kafka-native:3.9.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
