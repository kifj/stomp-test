apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry-sidecar
  namespace: stomp-test
spec:
  mode: sidecar
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug: {}
      otlp:
        endpoint: "jaeger-all-in-one-collector.observability:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
    processors:
      batch: {}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: :55679
    service:
      extensions:
        - zpages
        - health_check
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          exporters:
            - otlp
          processors:
            - batch
          receivers:
            - otlp
        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - prometheus
